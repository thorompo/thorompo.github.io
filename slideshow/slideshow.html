<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slideshow Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
    body { font-family: 'JetBrains Mono', monospace; background-color: #0d1117; color: #c9d1d9; }
    .glow { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); }
  </style>
  <link rel="stylesheet" href="slideshow.css?v=2">
</head>
<body class="flex flex-col items-center min-h-screen p-4 sm:p-6">

  <header class="w-full max-w-6xl mb-6">
    <div class="flex flex-col items-center text-center mb-6">
      <a href="../index.html" class="self-start text-sm text-gray-400 hover:text-sky-400 mb-3">&larr; Back</a>
      <h1 class="text-4xl sm:text-5xl font-bold mb-2 text-sky-400 glow">Slideshow Maker</h1>
      <p class="text-gray-400 text-sm">Load photos &amp; videos &middot; drag to reorder &middot; play with transitions</p>
    </div>

    <div id="toolbar" class="flex flex-wrap items-center justify-center gap-3 p-4 bg-gray-900/60 border border-gray-700 rounded-xl">
      <button id="playBtn" class="btn btn-primary" title="Start slideshow">
        <span>&#9654;</span>
        <span>Play</span>
      </button>

      <label class="ctrl">
        <span class="ctrl-label">Transition</span>
        <select id="transitionSelect" class="ctrl-input">
          <option value="fade">Fade</option>
          <option value="crossfade">Crossfade</option>
          <option value="slide-left">Slide Left</option>
          <option value="slide-up">Slide Up</option>
          <option value="zoom">Zoom</option>
          <option value="none">None</option>
        </select>
      </label>

      <label class="ctrl">
        <span class="ctrl-label">Total duration (s)</span>
        <input id="totalDuration" class="ctrl-input" type="number" min="1" step="1" value="30">
      </label>

      <span id="perSlideInfo" class="text-xs text-gray-400"></span>

      <div class="flex-1"></div>

      <button id="addBtn" class="btn btn-ghost" title="Add photos or videos">
        <span>+ Add media</span>
      </button>
      <button id="clearBtn" class="btn btn-ghost" title="Clear all">Clear</button>
      <button id="exportBtn" class="btn btn-ghost" title="Export order to file">Export order</button>
      <button id="importBtn" class="btn btn-ghost" title="Import saved config">Import config</button>

      <input id="fileInput" type="file"
             accept="image/*,video/*,.heic,.heif,.HEIC,.HEIF,.mov,.MOV,.mp4,.MP4,.m4v,.webm,.avi,.3gp,.mkv"
             multiple hidden>
      <input id="configInput" type="file" accept="application/json,.json" hidden>
    </div>

    <div id="statusBar" class="mt-3 text-xs text-gray-400 text-center min-h-[1rem]"></div>
  </header>

  <main class="w-full max-w-6xl">
    <div id="emptyState" class="border border-dashed border-gray-700 rounded-xl p-10 text-center text-gray-400">
      <p class="mb-3">No media loaded yet.</p>
      <p class="text-sm">Click <span class="text-sky-400">+ Add media</span> to pick photos and videos from your device.</p>
      <p class="text-xs text-gray-500 mt-3">Supported: JPG, PNG, WEBP, GIF, HEIC/HEIF (iPhone), MP4, MOV, M4V, WEBM, 3GP, MKV, AVI.</p>
    </div>

    <ul id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 hidden"></ul>
  </main>

  <!-- Slideshow player overlay -->
  <div id="player" class="hidden">
    <div id="stage">
      <div class="slide-layer" id="layerA"></div>
      <div class="slide-layer" id="layerB"></div>
    </div>
    <div id="playerHud">
      <button id="prevBtn" class="hud-btn" title="Previous">&#9664;</button>
      <button id="pauseBtn" class="hud-btn" title="Pause / Resume">&#10073;&#10073;</button>
      <button id="nextBtn" class="hud-btn" title="Next">&#9654;</button>
      <span id="playerCounter" class="text-xs text-gray-300"></span>
      <div class="flex-1"></div>
      <button id="closePlayer" class="hud-btn" title="Close (Esc)">&#10005;</button>
    </div>
  </div>

  <footer class="mt-12 text-gray-600 text-sm">
    <p>© 2026 Tibor | Sr Java Dev</p>
  </footer>

  <script src="slideshow.js?v=1" defer></script>
</body>
</html>
